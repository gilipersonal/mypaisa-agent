# One catalog pins every version the web app uses (MA-194, ARCHITECTURE §8.4). The iOS app's React Native shell
# joins this workspace with MA-165 and takes its shared versions from here.
packages:
  - '.'
catalog:
  '@eslint/js': 10.0.1
  '@lucide/svelte': 1.66.0
  '@sveltejs/adapter-static': 4.0.1
  '@sveltejs/kit': 3.1.1
  '@sveltejs/vite-plugin-svelte': 7.3.1
  '@tailwindcss/vite': 4.3.3
  '@tanstack/svelte-query': 6.3.8
  '@types/node': 24.19.2
  '@vitest/coverage-v8': 5.1.0
  bits-ui: 2.20.3
  clsx: 2.1.1
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-svelte: 3.23.1
  globals: 17.14.0
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  prettier: 3.9.10
  prettier-plugin-svelte: 4.1.1
  prettier-plugin-tailwindcss: 0.8.1
  svelte: 5.57.3
  svelte-check: 4.7.8
  tailwind-merge: 3.7.0
  tailwind-variants: 4.0.1
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.1.0
# Supply chain: a version is installed only once it has been public for a day, and no package runs install scripts
# but those named here.
minimumReleaseAge: 1440
onlyBuiltDependencies:
  - esbuild
# Security overrides: a patched version forced where a tool still pins a vulnerable one (pnpm audit, MA-194).
overrides:
  minimatch: '>=11.0.1'
# Peer ranges that lag SvelteKit 3 and TypeScript 6 upstream; each works (svelte-check, vitest and the build pass).
peerDependencyRules:
  allowedVersions:
    runed>@sveltejs/kit: '3'
    openapi-typescript>typescript: '6'
