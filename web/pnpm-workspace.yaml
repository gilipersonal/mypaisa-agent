# One catalog pins every version both doors use (MA-194, MA-165, ARCHITECTURE §8.4, §8.5): the web app and the iOS app's
# React Native shell are one workspace, with one lockfile, so the TypeScript they share runs on the same packages.
packages:
  - '.'
  - '../ios'
catalog:
  '@eslint/js': 10.0.1
  '@lucide/svelte': 1.69.0
  '@sveltejs/adapter-static': 4.0.1
  '@sveltejs/kit': 3.1.1
  '@sveltejs/vite-plugin-svelte': 7.3.1
  '@tailwindcss/vite': 4.3.4
  '@tanstack/query-core': 5.106.1
  '@tanstack/react-query': 5.106.1
  '@tanstack/svelte-query': 6.3.11
  '@types/node': 24.19.2
  '@vitest/coverage-v8': 5.1.0
  bits-ui: 2.20.6
  clsx: 2.1.1
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-svelte: 3.24.0
  globals: 17.14.0
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  prettier: 3.9.10
  prettier-plugin-svelte: 4.1.1
  prettier-plugin-tailwindcss: 0.8.1
  svelte: 5.57.3
  svelte-check: 4.7.8
  tailwind-merge: 3.7.0
  tailwind-variants: 4.0.1
  tailwindcss: 4.3.4
  tw-animate-css: 1.4.0
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.6
  vitest: 5.1.0
# Supply chain: a version is installed only once it has been public for a day, and no package runs install scripts
# but those named here.
minimumReleaseAge: 1440
onlyBuiltDependencies:
  - esbuild
# Jest 30's file watcher: its prebuilt binary is enough, so its build script stays off, by name, so an install does not stop.
allowBuilds:
  '@parcel/watcher': false
# Peer ranges that lag SvelteKit 3 and TypeScript 6 upstream; each works (svelte-check, vitest and the build pass).
peerDependencyRules:
  allowedVersions:
    runed>@sveltejs/kit: '3'
    openapi-typescript>typescript: '6'
# Security overrides (MA-194): the patched minimatch, only for the tools that work with it (eslint and
# typescript-eslint). openapi-typescript's @redocly/openapi-core calls minimatch 5's API, so it keeps 5.x, with a dated
# exception in osv-scanner.toml.
overrides:
  '@eslint/config-array>minimatch': '>=11.0.1'
  # One query core at both doors (TECH_STACK §2): Svelte Query's own pin sits one patch behind React Query's.
  '@tanstack/query-core': 5.106.1
  '@typescript-eslint/typescript-estree>minimatch': '>=11.0.1'
  'eslint>minimatch': '>=11.0.1'
