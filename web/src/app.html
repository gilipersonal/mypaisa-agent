<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0A0F18" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- The fonts are the app's own (MA-340): Inter's Latin file and the Nunito figures, preloaded; nothing from Google. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/nunito-figures-latin-800.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<title>MyPaisa</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
