# pre-commit (MA-24): `uv run --directory backend pre-commit install` once per clone. The hooks run the backend's own
# pinned tools through uv inside backend/, so a commit is checked by exactly what CI and scripts/backend_gates.sh run.
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes, MA-326)
        entry: scripts/security_scan.sh staged
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix --exit-non-zero-on-fix .
        language: system
        pass_filenames: false
        files: ^backend/.*\.pyi?$
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        pass_filenames: false
        files: ^backend/.*\.pyi?$
      - id: pyright
        name: pyright strict (backend)
        entry: uv run --directory backend pyright
        language: system
        pass_filenames: false
        files: ^backend/.*\.pyi?$
      - id: lint-imports
        name: import layers (backend)
        entry: uv run --directory backend lint-imports
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: uv-lock
        name: backend/uv.lock matches pyproject.toml
        entry: uv lock --directory backend --check
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|uv\.lock)$
