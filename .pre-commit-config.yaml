# pre-commit (MA-24): `uv run pre-commit install` once per clone. The hooks run the project's own pinned tools
# through uv, so a commit is checked by exactly what CI and scripts/backend_gates.sh run.
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        exclude: ^(scripts|review|docs|\.claude|\.codex)/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^(scripts|review|docs|\.claude|\.codex)/
      - id: pyright
        name: pyright (strict)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        files: ^(src|tests)/
      - id: lint-imports
        name: import layers
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^src/
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
