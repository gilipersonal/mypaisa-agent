<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MyPaisa: a navy coin with a pound sign, a thin orbit, and a coral dot resting at its top right">
  <title>MyPaisa</title>
  <style>
    .ring, .coin { transform-box: fill-box; transform-origin: center; }
    .orbit { transform-box: view-box; transform-origin: 256px 256px; }
    @media (prefers-reduced-motion: no-preference) {
      .coin { animation: mp-pop 440ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      .ring { animation: mp-ring 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both; }
      .pound { animation: mp-fade 360ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both; }
      .orbit { animation: mp-orbit 1000ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both; }
      .dot { animation: mp-fade 220ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both; }
    }
    @keyframes mp-pop { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: none; } }
    @keyframes mp-ring { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
    @keyframes mp-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes mp-orbit { from { transform: rotate(-250deg); } to { transform: none; } }
  </style>
  <defs>
    <mask id="mp-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <g class="orbit"><circle class="dot" cx="406.85" cy="105.15" r="54.4" fill="#000000"/></g>
    </mask>
  </defs>
  <g mask="url(#mp-gap)">
    <circle class="ring" cx="256" cy="256" r="213.33" fill="none" stroke="#13213A" stroke-width="17.07"/>
  </g>
  <circle class="coin" cx="256" cy="256" r="155.73" fill="#13213A"/>
  <g class="pound" fill="none" stroke="#FFFFFF" stroke-width="26.28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M304.85 215.98 C301.87 191.49 285.74 176.55 264.23 176.55 C239.74 176.55 223.62 193.88 223.62 218.37 L223.62 294.83 C223.62 313.34 217.05 325.29 202.11 335.45"/>
    <path d="M202.11 335.45 L316.8 335.45"/>
    <path d="M197.33 264.96 L274.99 264.96"/>
  </g>
  <g class="orbit"><circle class="dot" cx="406.85" cy="105.15" r="40.53" fill="#FF6B4F"/></g>
</svg>
