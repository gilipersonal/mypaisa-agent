<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MyPaisa Agent: a pound coin with a market line breaking out of it, watched from orbit">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2f2a4d"/>
      <stop offset="1" stop-color="#14162a"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2cefd"/>
      <stop offset="0.55" stop-color="#9184d9"/>
      <stop offset="1" stop-color="#5d5294"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f4ff"/>
      <stop offset="1" stop-color="#796cbf"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- ambient halo behind the coin -->
  <circle cx="256" cy="256" r="150" fill="#9184d9" opacity="0.28" filter="url(#soft)"/>

  <!-- orbit: the watcher's ring, three currencies in flight -->
  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="222" ry="92" fill="none" stroke="#b5abfc" stroke-width="5" stroke-opacity="0.55"/>
    <circle cx="464.7" cy="287.5" r="13" fill="#e7e5fe"/>
    <circle cx="47.3" cy="287.5" r="10" fill="#b5abfc"/>
  </g>

  <!-- the coin -->
  <circle cx="256" cy="256" r="142" fill="url(#coin)" stroke="url(#rim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#2b2741" stroke-opacity="0.35" stroke-width="4"/>
  <text x="256" y="300" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="150" font-weight="600" fill="#161826">£</text>

  <!-- the market line breaking out of the coin -->
  <polyline points="136,376 180,352 214,366 256,322 298,340 342,294 380,308 426,246"
            fill="none" stroke="#14162a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <polyline points="136,376 180,352 214,366 256,322 298,340 342,294 380,308 426,246"
            fill="none" stroke="#5faf7d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="426" cy="246" r="30" fill="#5faf7d" opacity="0.25"/>
  <circle cx="426" cy="246" r="17" fill="#5faf7d" stroke="#14162a" stroke-width="6"/>
</svg>
