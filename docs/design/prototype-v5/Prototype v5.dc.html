<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyPaisa · Prototype v5</title>
<script src="../app-v1/support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="../app-v1/tokens.css" />
<link rel="stylesheet" href="../app-v1/ios.css" />
<link rel="stylesheet" href="../app-v1/motion.css" />
<link rel="stylesheet" href="prototype-v5.css" />
<script src="../app-v1/motion.js"></script>
<script src="prototype-v5-data.js"></script>
<script src="prototype-v5-kit.js"></script>
<script src="prototype-v5.js"></script>
<script src="prototype-v5-ch-talk.js"></script>
<script src="prototype-v5-ch-wealth.js"></script>
<script src="prototype-v5-ch-engine.js"></script>
<script src="prototype-v5-ch-forecast.js"></script>
<script src="prototype-v5-ch-team.js"></script>
<style>
/* MyPaisa · Prototype v5 (MA-291). One clickable walk-through of the whole journey, phases 0 to 20, at five
   doors: the web app at 1440 (shell 1a, the chat beside) and at 390, the iPhone (shell 1a, Chat first,
   402 × 874), the iPad in landscape (1180 × 820, the chat beside it from about 1133 pt) and the foldable open
   (880 × 1036). One household, one clock (today Mon 26 Oct 2026, prices at the Fri 23 Oct close), one ledger
   as of each step's time. Screens not yet picked carry the Draft chip. Illustrative figures and names. */
html, body { margin: 0; height: 100%; background: #ECEAE6; }
</style>
</helmet>
<div class="pv5-host" data-screen-label="Prototype v5"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  componentDidMount() {
    const go = () => {
      const el = document.querySelector('.pv5-host');
      if (window.MP5 && window.MP5.mount && window.MP5K && el) window.MP5.mount(el);
      else this._t = setTimeout(go, 40);
    };
    go();
  }
  componentWillUnmount() { clearTimeout(this._t); }
}
</script>
</body>
</html>
