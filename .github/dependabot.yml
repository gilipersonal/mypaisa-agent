# Grouped weekly updates (MA-326): one PR per ecosystem a week, security fixes as they come.
# Each PR still carries its MA key in the title before it can merge (jira-key.yml).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      backend:
        patterns: ["*"]
    commit-message:
      prefix: "MA-326:"
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      scripts:
        patterns: ["*"]
    commit-message:
      prefix: "MA-326:"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      web:
        patterns: ["*"]
    # Majors the toolchain cannot take yet (closed PR #93, 3 Nov 2026): svelte-check supports TypeScript 5 and 6
    # only, and the web app runs on Node 24, so @types/node stays at 24. Lift each when its tool catches up.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "MA-326:"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "MA-326:"
