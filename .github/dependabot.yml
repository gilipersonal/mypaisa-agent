# Grouped weekly updates (MA-326): one PR per ecosystem a week, security fixes as they come.
# Each PR still carries its MA key in the title before it can merge (jira-key.yml).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      backend:
        patterns: ["*"]
    commit-message:
      prefix: "MA-326:"
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      scripts:
        patterns: ["*"]
    commit-message:
      prefix: "MA-326:"
  # /web is the pnpm workspace root, and its lockfile covers ios/ too (MA-165).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      web:
        patterns: ["*"]
    # Majors the toolchain cannot take yet (closed PR #93, 3 Nov 2026): svelte-check supports TypeScript 5 and 6
    # only, and the web app runs on Node 24, so @types/node stays at 24. Lift each when its tool catches up.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React Native 0.88 supports only Babel 7: Babel 8 stops the iOS bundle at its first file (PR #96, MA-327). Lift
      # these when React Native moves.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # hermes-compiler must be the version react-native names, or the app crashes at launch on a bytecode mismatch and
      # the iOS gate finds two compilers (PR #113, MA-344). It moves by hand with react-native (ios/CLAUDE.md, rule 8),
      # never on its own.
      - dependency-name: "hermes-compiler"
    commit-message:
      prefix: "MA-326:"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "MA-326:"
