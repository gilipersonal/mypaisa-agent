name: CodeQL

# CodeQL's advanced setup (MA-351), in place of the repository's default setup (MA-346).
#
# - actions, javascript-typescript and python: every pull request, every push to main and weekly, on Linux, with no
#   build (build-mode none).
# - Swift is not analysed on GitHub (MA-166; Arun, 26 Nov 2026: "CodeQL Swift check, lets turn it off. We dont need
#   to do any iOS build on Github actions ... all testing and quality check will be done on local."). No iOS build
#   runs on GitHub Actions; Swift is scanned on the laptop by semgrep's Swift rules (MA-363).
#
# The check names stay "Analyze (<language>)", the names the merge rule reads (MA-346). The query suite stays the
# default one (no `queries` input: naming one would add a pack, and "default" is not a pack). Default setup is switched off in the repository's settings, since the two cannot run side by side.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
