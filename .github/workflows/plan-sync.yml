name: plan-sync

# The plan, the designs and Jira stay in step (MA-155, .claude/rules/plan-sync.md).
# This is the repo-side check: docs/trace.json against ARCHITECTURE.md, PLAN.md,
# the docs that cite Jira keys and the Claude Design mirror in docs/design/.
# No secrets, no network: Claude Design itself is checked before every PR by
# `python3 scripts/design_sync.py check` (the design-sync gate and the PR hook,
# MA-259), which needs the claude-design login; here the selftest runs its
# offline cases and `check` holds the copies to claude-design.json.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  plan-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The board-name, board-date, motion-role and design-sync checks know a board, a weekday, a role and a drift from their faults
        run: python3 scripts/plan_sync.py selftest

      - name: Trace, docs and design mirror agree
        run: python3 scripts/plan_sync.py check

      - name: Every text and control is legible in light and dark, at 25% brightness too (MA-181)
        run: python3 scripts/contrast_check.py --selftest && python3 scripts/contrast_check.py
