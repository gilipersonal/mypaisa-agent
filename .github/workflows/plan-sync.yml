name: plan-sync

# The plan, the designs and Jira stay in step (MA-155, .claude/rules/plan-sync.md).
# This is the repo-side check: docs/trace.json against ARCHITECTURE.md, PLAN.md,
# the docs that cite Jira keys, the roadmap, the Confluence pages rendered in the
# repo, and the board files the trace cites in docs/design/. No secrets, no
# network: the boards are drawn in the repo and nowhere else (MA-260), and git
# is their only record (MA-296), so the check reads each cited board on disk.
#
# The checks on the boards' content (board_fit.js, a11y_live.js,
# prototype_smoke.js, contrast_check.py and the generators' --check) were
# stopped by MA-303. Arun, 2 Nov 2026: "All the 6 checks currently run on
# docs/design. Lets stop that. I need this checks as QA when I ask, but on
# actual code implemented". QA on the code, on request, comes with MA-194
# (the web skeleton) and MA-165 (the iOS shell).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  plan-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the PR can be compared with its base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The selftest proves plan-sync's own checks still bite. It takes about
      # nine seconds since MA-303, so it runs on every PR.
      - name: Plan-sync's own checks still refuse what they must (selftest)
        run: python3 scripts/plan_sync.py selftest

      - name: Trace, docs, roadmap, Confluence pages and cited boards agree
        run: python3 scripts/plan_sync.py check

      - name: Every code file the PR changes belongs to its story
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/plan_sync.py pr-files --base "$BASE_SHA"
