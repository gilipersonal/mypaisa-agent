name: plan-sync

# The plan, the designs and Jira stay in step (MA-155, .claude/rules/plan-sync.md).
# This is the repo-side check: docs/trace.json against ARCHITECTURE.md, PLAN.md,
# the docs that cite Jira keys and the boards in docs/design/. No secrets, no
# network: since MA-260 the boards are drawn in the repo and nowhere else, so
# CI runs the same offline `python3 scripts/design_sync.py check` as the
# design-sync gate and the PR hook (each board against its record in
# docs/design/claude-design.json, and the MyPaisa Boards Artifact's stamp).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  plan-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The board-name, board-date, motion-role, board-record and PR-hook checks know a board, a weekday, a role and a drift from their faults
        run: python3 scripts/plan_sync.py selftest

      - name: Trace, docs and boards agree
        run: python3 scripts/plan_sync.py check

      - name: Every board matches its record, and the MyPaisa Boards Artifact was published after the last change (MA-260)
        run: python3 scripts/design_sync.py check

      - name: Every text and control is legible in light and dark, at 25% brightness too (MA-181)
        run: python3 scripts/contrast_check.py --selftest && python3 scripts/contrast_check.py
