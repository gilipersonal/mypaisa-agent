name: plan-sync

# The plan, the designs and Jira stay in step (MA-155, .claude/rules/plan-sync.md).
# This is the repo-side check: docs/trace.json against ARCHITECTURE.md, PLAN.md,
# the docs that cite Jira keys and the boards in docs/design/. No secrets, no
# network: the boards are drawn in the repo and nowhere else (MA-260), and git
# is their only record (MA-296), so the check reads each board as it is on disk.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  plan-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The board-name, board-date, motion-role, missing-board and PR-hook checks know a board, a weekday, a role and a drift from their faults
        run: python3 scripts/plan_sync.py selftest

      - name: Trace, docs and boards agree
        run: python3 scripts/plan_sync.py check

      - name: Every text and control is legible in light and dark, at 25% brightness too (MA-181)
        run: python3 scripts/contrast_check.py --selftest && python3 scripts/contrast_check.py
