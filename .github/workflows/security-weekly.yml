name: Security sweep

# Every Monday at 04:00 UTC on main (MA-326): a CVE published with no new commit
# is caught within a week. The same scans as CI's Security job (osv-scanner
# reads web/pnpm-lock.yaml too), plus the backend's gates (pip-audit --strict)
# and web's pnpm audit. A failure fails the run and GitHub emails it.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-weekly
  cancel-in-progress: false

jobs:
  sweep:
    name: Weekly security sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python3 -m pip install --disable-pip-version-check "uv==0.12.9"
      - name: Secrets, SAST, dependencies and workflows
        run: scripts/security_scan.sh
      - name: The backend's gates, pip-audit --strict on uv.lock included
        run: |
          (cd backend && uv sync --locked)
          scripts/backend_gates.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: The web app's dependencies (pnpm audit)
        run: |
          corepack enable
          corepack pnpm@12.16.1 --dir web install --frozen-lockfile --silent
          corepack pnpm@12.16.1 --dir web audit --audit-level high
