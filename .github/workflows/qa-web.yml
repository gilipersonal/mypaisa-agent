name: QA (web)

# The web app's visual regression and accessibility (MA-304; .claude/rules/testing.md). Arun, 26 Nov 2026: Argos for
# visual regression and accessibility on the GitHub pipeline, "Only When I ask, create a manual triggered CI"; axe in
# CI with Argos's ARIA snapshots; "No AXE testing should be done on local".
#
# Started only by hand, never by a pull request or a push: `gh workflow run qa-web.yml -r <branch>` (add
# `-f suite=smoke` or `-f sweep=true`). It runs `pnpm --dir web test:qa`: the Playwright suite with the QA fixture
# (web/e2e/fixtures/qa.ci.ts, axe's one importer, WCAG 2.2 AA, fail closed), Chromium and WebKit, against the app the
# suite builds and previews on :4173. The Argos reporter (on GitHub only) sends the screenshots and ARIA snapshots, and
# a failed upload fails the run. The report and the test results, the axe results with them, are this run's artifact.
#
# Argos signs in tokenless: no ARGOS_TOKEN and no id-token here. The SDK sends the repository, the job and the run, and
# Argos checks through its GitHub App that this run is in progress on that branch and commit. Granting id-token would
# make the SDK try OIDC instead and fail unless OIDC is on in the Argos project. The baseline is main's build of the
# same name; a run on main is the next baseline.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which tests: smoke (@smoke, under 2 minutes), regression (@regression) or all"
        type: choice
        options: [smoke, regression, all]
        default: all
      sweep:
        description: "Add the @sweep tests: widths 320 to 1920 (its own Argos build, web-qa-sweep)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  qa-web:
    name: Playwright, axe and Argos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # pnpm comes from corepack at the version web/package.json pins; the packages from web/pnpm-lock.yaml, as
      # scripts/web_gates.sh installs them.
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate
      - name: Install the web app's packages, as the lockfile has them
        run: pnpm --dir web install --frozen-lockfile
      - name: Playwright's version
        id: playwright
        run: |
          version=$(pnpm --dir web exec playwright --version)
          version=${version#Version }
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read Playwright's version (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # On a cache hit the browsers are there and only the system packages they need are installed.
      - name: Install Chromium and WebKit with their system packages
        run: pnpm --dir web exec playwright install --with-deps chromium webkit
      # suite picks the tag. @sweep stays out unless sweep is set: web/playwright.config.ts leaves it out of every
      # functional project and adds the sweep's own projects only for MP_SWEEP=1 (or an argument naming @sweep), so no
      # argument here names @sweep unless sweep is set. A partial run is an Argos subset, so the screenshots it did not
      # take are not reported as removed; the sweep is its own Argos build, since it takes more widths.
      - name: Playwright with axe, screenshots and ARIA snapshots to Argos
        env:
          SUITE: ${{ inputs.suite }}
          SWEEP: ${{ inputs.sweep }}
          ARGOS_REFERENCE_BRANCH: main
        run: |
          case "$SUITE" in
            smoke) grep='@smoke' ;;
            regression) grep='@regression' ;;
            all) grep='' ;;
            *) echo "::error::unknown suite '$SUITE'"; exit 1 ;;
          esac
          args=()
          if [ "$SWEEP" = "true" ]; then
            build=web-qa-sweep
            export MP_SWEEP=1
            if [ -n "$grep" ]; then grep="$grep|@sweep"; fi
          else
            build=web-qa
          fi
          if [ -n "$grep" ]; then args+=(--grep "$grep"); fi
          if [ "$SUITE" != "all" ]; then export ARGOS_SUBSET=true; fi
          export ARGOS_BUILD_NAME="$build"
          {
            echo "Suite: \`$SUITE\`, sweep: \`$SWEEP\`, Argos build: \`$build\` against \`$ARGOS_REFERENCE_BRANCH\`"
            echo "Playwright: \`${args[*]:-every test}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm --dir web test:qa "${args[@]}"
      # The run's attempt is in the name, so a rerun of the job uploads its own.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-web-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
