name: jira-key

# Every PR is traced to a Jira issue: the title carries [MA-n], the branch
# carries MA-n, and every commit subject starts with MA-n. No secrets,
# no network, so it runs on forks and drafts alike. Written by /jira-flow:init.
#
# Dependabot (MA-326) names its own branches and titles its PRs with its commit
# subject, which .github/dependabot.yml prefixes "MA-326: ". For a PR opened by
# dependabot[bot] (the PR's author, which cannot be spoofed, not github.actor),
# the title may start "MA-n: " and the branch check is skipped; every commit
# subject must still start with MA-n.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jira-key-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR traced to Jira
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR title carries [MA-n]
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          pattern='^\[MA-[0-9]+\] '
          if [ "$AUTHOR" = "dependabot[bot]" ]; then pattern='^(\[MA-[0-9]+\] |MA-[0-9]+: )'; fi
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title must start with [MA-n] followed by a space. Got: $TITLE"
            exit 1
          fi

      - name: Branch carries MA-n
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -qE 'MA-[0-9]+'; then
            echo "::error::Head branch must carry MA-n (MA-n-short-slug). Got: $BRANCH"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Every commit subject starts with MA-n
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          while IFS= read -r line; do
            if ! printf '%s' "$line" | grep -qE '^MA-[0-9]+: '; then
              echo "::error::Commit subject must start with 'MA-n: '. Got: $line"
              bad=1
            fi
          done < <(git log --format=%s "$BASE".."$HEAD")
          exit $bad
