<title>MyPaisa Boards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- The same self-hosted fonts as the boards and the web app, never Google Fonts (MA-340). -->
<link rel="stylesheet" href="ds-v1/fonts.css">
<style>
/* Layout: a ledger index beside a light table. The board list runs down the left like an
   account's statement lines; the chosen board fills the rest. On a phone, the list and the
   board take the screen in turn. Colours and faces are MyPaisa DS v1's own ("Warm ledger"). */
:root {
  --bg: #F6F4F1; --surface: #FFFFFF; --surface-2: #F0EDE8; --line: #E4E0DA;
  --ink: #14171F; --ink-2: #4E5462; --ink-3: #646A78;
  --hero: #13213A; --hero-ink: #FFFFFF; --hero-ink-2: #B7C2D6; --coral: #FF6B4F;
  --accent: #C2381F; --focus: #2453C9; --board-ground: #ECEAE6;
  --display: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
  --body: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A0F18; --surface: #151C27; --surface-2: #1E2633; --line: #283141;
  --ink: #F3F5F8; --ink-2: #C5CCD7; --ink-3: #ADB6C4;
  --hero: #1A2944; --hero-ink: #FFFFFF; --hero-ink-2: #B7C2D6; --coral: #FF7A5E;
  --accent: #FFAF9B; --focus: #8FB0FF; --board-ground: #1E2633; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A0F18; --surface: #151C27; --surface-2: #1E2633; --line: #283141;
  --ink: #F3F5F8; --ink-2: #C5CCD7; --ink-3: #ADB6C4;
  --hero: #1A2944; --hero-ink: #FFFFFF; --hero-ink-2: #B7C2D6; --coral: #FF7A5E;
  --accent: #FFAF9B; --focus: #8FB0FF; --board-ground: #1E2633; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); display: flex; flex-direction: column; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { background: var(--hero); color: var(--hero-ink);
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.top h1 { margin: 0; font: 800 20px/1.2 var(--display); letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.top h1 .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); flex: none; }
.top p { margin: 0; color: var(--hero-ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }

.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
.index { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-height: 0;
  padding-block: 12px 24px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; background: var(--surface-2); border-radius: 9px; margin-bottom: 12px; }
.tabs button { font: 600 12px/1 var(--body); color: var(--ink-2); background: none; border: 0; border-radius: 7px; padding: 9px 4px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.blurb { margin: 0 4px 14px; color: var(--ink-3); font-size: 12.5px; }
.group { margin: 0 0 14px; }
.group h2 { margin: 0 4px 6px; font: 600 11px/1.3 var(--body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; }
.group h2 span { font-variant-numeric: tabular-nums; }
.group ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.group a { display: block; padding: 7px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
.group a:hover { background: var(--surface-2); }
.group a[aria-current="page"] { background: var(--surface-2); color: var(--accent); font-weight: 600; }
.group a.part { color: var(--ink-3); font-size: 12.5px; padding-left: 18px; }

.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; border-bottom: 1px solid var(--line); background: var(--bg);
  padding-block: 10px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .back { display: none; font: 600 13px var(--body); color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.bar h2 { margin: 0; font: 700 17px/1.25 var(--display); text-wrap: balance; min-width: 0; }
.bar code { font: 12px var(--mono); color: var(--ink-3); overflow-wrap: anywhere; min-width: 0; }
.bar .step { margin-left: auto; display: flex; gap: 6px; }
.bar .step button { font: 600 12px var(--body); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
.bar .step button:disabled { opacity: .45; cursor: default; }
.frame { flex: 1; min-height: 0; position: relative; background: var(--board-ground); }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--board-ground); }
.frame .loading { position: absolute; top: 16px; left: 16px; font-size: 12.5px; color: var(--ink-3); }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .index { border-right: 0; padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .shell[data-view="board"] .index { display: none; }
  .shell[data-view="list"] .stage { display: none; }
  .bar .back { display: inline-block; }
  .bar { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
</style>

<header class="top">
  <h1><span class="mark" aria-hidden="true"></span>MyPaisa Boards</h1>
  <p id="summary">The boards in docs/design, drawn in the repo</p>
</header>

<div class="shell" id="shell" data-view="board">
  <nav class="index" aria-label="Boards">
    <div class="tabs" role="tablist" id="tabs"></div>
    <p class="blurb" id="blurb"></p>
    <div id="groups"></div>
  </nav>
  <main class="stage">
    <div class="bar">
      <button class="back" id="back" type="button">‹ All boards</button>
      <h2 id="bname"></h2>
      <code id="bfile"></code>
      <div class="step">
        <button id="prev" type="button" aria-label="Previous board">‹ Previous</button>
        <button id="next" type="button" aria-label="Next board">Next ›</button>
      </div>
    </div>
    <div class="frame">
      <span class="loading" id="loading">Loading the board…</span>
      <iframe id="board" title="Board"></iframe>
    </div>
  </main>
</div>

<script>
const DATA = /*BOARDS*/null;
const byId = Object.fromEntries(DATA.boards.map(b => [b.id, b]));
const $ = id => document.getElementById(id);
let project = "ios-v1", current = null;

const counts = DATA.projects.map(p => DATA.boards.filter(b => b.project === p.id && !b.label.startsWith("Part:")).length);
$("summary").textContent = `${counts.reduce((a, b) => a + b, 0)} boards in three sets, drawn in the repo in docs/design and reviewed here`;

function renderTabs() {
  $("tabs").innerHTML = "";
  DATA.projects.forEach((p, i) => {
    const t = document.createElement("button");
    t.type = "button"; t.role = "tab"; t.id = "tab-" + p.id;
    t.textContent = p.name.replace("MyPaisa ", "");
    t.setAttribute("aria-selected", String(p.id === project));
    t.title = `${p.name}: ${counts[i]} boards`;
    t.onclick = () => { project = p.id; renderTabs(); renderList(); };
    $("tabs").appendChild(t);
  });
}

function renderList() {
  const p = DATA.projects.find(x => x.id === project);
  $("blurb").textContent = p.blurb;
  const box = $("groups"); box.innerHTML = "";
  for (const g of p.groups) {
    const items = DATA.boards.filter(b => b.project === project && b.group === g);
    if (!items.length) continue;
    const sec = document.createElement("section"); sec.className = "group";
    const n = items.filter(b => !b.label.startsWith("Part:")).length;
    sec.innerHTML = `<h2>${g}<span>${n}</span></h2>`;
    const ul = document.createElement("ul");
    for (const b of items) {
      const li = document.createElement("li"), a = document.createElement("a");
      a.href = "#" + b.id; a.textContent = b.label;
      if (b.label.startsWith("Part:")) a.className = "part";
      if (current && b.id === current.id) a.setAttribute("aria-current", "page");
      a.onclick = e => { e.preventDefault(); open(b.id, true); };
      li.appendChild(a); ul.appendChild(li);
    }
    sec.appendChild(ul); box.appendChild(sec);
  }
}

function open(id, fromList) {
  const b = byId[id]; if (!b) return;
  current = b;
  if (project !== b.project) { project = b.project; renderTabs(); }
  renderList();
  $("bname").textContent = b.label;
  $("bfile").textContent = b.path;
  $("loading").hidden = false;
  $("board").title = b.label;
  $("board").src = b.path.split("/").map(encodeURIComponent).join("/");
  const i = DATA.boards.indexOf(b);
  $("prev").disabled = i === 0; $("next").disabled = i === DATA.boards.length - 1;
  try { history.replaceState(null, "", "#" + b.id); } catch (e) {}
  $("shell").dataset.view = "board";
  if (fromList) $("board").focus({ preventScroll: true });
}

$("board").addEventListener("load", () => { $("loading").hidden = true; });
$("prev").onclick = () => open(DATA.boards[DATA.boards.indexOf(current) - 1].id);
$("next").onclick = () => open(DATA.boards[DATA.boards.indexOf(current) + 1].id);
$("back").onclick = () => { $("shell").dataset.view = "list"; };
addEventListener("hashchange", () => { const id = location.hash.slice(1); if (byId[id] && id !== current?.id) open(id); });

renderTabs();
const start = (location.hash || "").slice(1);
open(byId[start] ? start : "ios-iphone-v4-home");
if (!byId[start] && matchMedia("(max-width: 760px)").matches) $("shell").dataset.view = "list";
</script>
